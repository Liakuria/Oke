<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桶地下文字 結合＆自動翻訳ツール</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      padding: 20px;
      gap: 2%;
    }

    /* 左エリア (25%): サイドバー */
    .sidebar {
      width: 25%;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }

    /* 右エリア (65%): メインワークスペース */
    .main-content {
      width: 65%;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }

    h2 {
      font-size: 0.95rem;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 6px;
    }

    .section-title {
      font-size: 0.8rem;
      color: #f59e0b;
      margin-top: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
    }

    /* パーツグリッド（4列表示） */
    .parts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .img-btn {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .img-btn:hover {
      border-color: #38bdf8;
      background: #1e293b;
    }

    .img-btn.selected {
      border-color: #f59e0b;
      background: #334155;
    }

    .img-btn img {
      max-width: 100%;
      height: 24px;
      object-fit: contain;
    }

    /* メインエリア表示 */
    .display-area {
      width: 100%;
      min-height: 100px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
    }

    .combined-char {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 6px;
      height: 40px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .combined-char:hover {
      border-color: #ef4444;
      background: #334155;
    }

    .combined-char:hover::after {
      content: '✕';
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: white;
      font-size: 10px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .combined-char img {
      height: 30px;
      object-fit: contain;
      pointer-events: none;
    }

    /* 翻訳出力エリア */
    .translation-output {
      width: 100%;
      min-height: 100px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 12px;
      color: #38bdf8;
      font-size: 1.2rem;
      font-weight: bold;
      word-break: break-all;
    }

    /* 辞書登録エリア */
    .dict-box {
      background: #0f172a;
      border: 1px dashed #f59e0b;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dict-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dict-input {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      width: 140px;
    }

    /* ボタン共通 */
    .btn {
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      border: none;
    }

    .btn-info { background: #38bdf8; color: #0f172a; }
    .btn-matrix { background: #a855f7; color: white; }
    .btn-add { background: #f59e0b; color: #0f172a; }
    .btn-delete { background: #f43f5e; color: white; }
    .btn-backspace { background: #334155; color: #38bdf8; border: 1px solid #475569; }
    .btn-clear { background: #ef4444; color: white; }

    .save-status {
      font-size: 0.8rem;
      color: #4ade80;
      padding: 8px;
      background: #0f172a;
      border-radius: 6px;
      text-align: center;
      margin-top: auto;
    }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #1e293b;
      width: 95%;
      max-width: 1200px;
      height: 90vh;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 8px;
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .tab-container { display: flex; gap: 10px; }
    .tab-btn {
      padding: 8px 16px;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab-btn.active { background: #f59e0b; color: #0f172a; font-weight: bold; }

    .modal-body {
      overflow: auto;
      flex-grow: 1;
      padding: 10px;
      background: #0f172a;
      border-radius: 8px;
    }

    .table-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .table-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .table-card img { height: 30px; object-fit: contain; }
    .table-card span { font-size: 0.75rem; color: #94a3b8; }

    /* 登録辞書一覧スタイル */
    .dict-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    /* 20x70 マトリックス表スタイル */
    .matrix-table-wrapper {
      overflow: auto;
      max-height: 100%;
    }

    .matrix-table {
      border-collapse: collapse;
      font-size: 0.75rem;
      text-align: center;
    }

    .matrix-table th, .matrix-table td {
      border: 1px solid #334155;
      padding: 4px 6px;
      min-width: 50px;
    }

    .matrix-table th {
      background: #1e293b;
      color: #38bdf8;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .matrix-table th.sticky-col {
      left: 0;
      z-index: 3;
      background: #1e293b;
    }

    .matrix-table td.sticky-col {
      position: sticky;
      left: 0;
      background: #1e293b;
      color: #f59e0b;
      font-weight: bold;
      z-index: 1;
    }

    .matrix-cell-char {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 24px;
    }

    .matrix-cell-char img {
      height: 20px;
      object-fit: contain;
    }

    .matrix-meaning {
      color: #4ade80;
      font-size: 0.7rem;
      font-weight: bold;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <aside class="sidebar">
      <h2>機能・パーツ選択</h2>

      <button id="open-table-btn" class="btn btn-info">📖 パーツ一覧を見る</button>
      <button id="open-matrix-btn" class="btn btn-matrix">📊 20×70 全組み合わせ表</button>

      <div class="section-title">◀ 左パーツ（1〜20）</div>
      <div class="parts-grid" id="left-parts-grid"></div>

      <div class="section-title">▶ 右パーツ（1〜70）</div>
      <div class="parts-grid" id="right-parts-grid"></div>

      <button id="backspace-btn" class="btn btn-backspace">⌫ 1文字消す</button>
      <button id="clear-btn" class="btn btn-clear">🗑️ 組み合わせ文章をクリア</button>

      <div id="save-status" class="save-status">💾 自動保存済み</div>
    </aside>

    <main class="main-content">
      <h2>桶地下文字 翻訳ワークスペース</h2>

      <div class="form-group">
        <label style="display: flex; justify-content: space-between;">
          <span>① 組み合わせた文章:</span>
          <span style="font-weight: normal; color: #64748b; font-size: 0.75rem;">※文字をクリックするとその文字だけ消去できます</span>
        </label>
        <div id="display-area" class="display-area"></div>
      </div>

      <div class="form-group">
        <label>② 辞書による自動翻訳結果:</label>
        <div id="auto-translation" class="translation-output"></div>
      </div>

      <div class="dict-box">
        <div class="dict-row">
          <label style="color:#f59e0b;">⚙️ 選択中の文字:</label>
          <span id="selected-pair-name" style="font-size:0.85rem; color:#38bdf8; font-weight:bold;">（文字未選択）</span>
          <input type="text" id="dict-meaning" class="dict-input" placeholder="意味 (例: あ)">
          <button id="add-dict-btn" class="btn btn-add">辞書に保存</button>
          <button id="del-dict-btn" class="btn btn-delete">🗑️ 選択中を辞書削除</button>
        </div>
        <div class="dict-row" style="margin-top: 4px;">
          <button id="open-dict-list-btn" class="btn btn-backspace">📖 登録済み辞書を見る</button>
          <button id="clear-dict-all-btn" class="btn btn-clear" style="padding: 4px 8px; font-size: 0.75rem;">⚠️ 辞書を全消去</button>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="color:#38bdf8;">パーツ対応表一覧</h3>
        <button class="close-modal-btn" id="close-modal-btn">&times;</button>
      </div>
      <div class="tab-container" id="modal-tabs">
        <button class="tab-btn active" id="tab-left-btn">左パーツ (20種)</button>
        <button class="tab-btn" id="tab-right-btn">右パーツ (70種)</button>
      </div>
      <div class="modal-body">
        <div class="table-grid" id="modal-table-grid"></div>
        <div id="modal-dict-list" style="display: none;"></div>
        <div id="modal-matrix-container" class="matrix-table-wrapper" style="display: none;"></div>
      </div>
    </div>
  </div>

  <script>
    // ▼ データ初期化
    const leftParts = Array.from({length: 20}, (_, i) => ({ 
      id: `L${i+1}`, 
      src: `images/left_${i+1}.jpg`, 
      name: `左パーツ ${i+1}` 
    }));

    const rightParts = Array.from({length: 70}, (_, i) => ({ 
      id: `R${i+1}`, 
      src: `images/right_${i+1}.jpg`, 
      name: `右パーツ ${i+1}` 
    }));

    let selectedLeft = null;
    let combinedTextList = []; 
    let dictionary = {}; 

    const leftContainer = document.getElementById('left-parts-grid');
    const rightContainer = document.getElementById('right-parts-grid');
    const displayArea = document.getElementById('display-area');
    const autoTranslation = document.getElementById('auto-translation');
    const selectedPairName = document.getElementById('selected-pair-name');
    const dictMeaning = document.getElementById('dict-meaning');
    const saveStatus = document.getElementById('save-status');

    function initKeyboards() {
      leftContainer.innerHTML = '';
      leftParts.forEach(part => {
        const btn = createBtn(part, () => {
          document.querySelectorAll('#left-parts-grid .img-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedLeft = part;
        });
        leftContainer.appendChild(btn);
      });

      rightContainer.innerHTML = '';
      rightParts.forEach(part => {
        const btn = createBtn(part, () => {
          if (!selectedLeft) return alert('先に左パーツを選んでください');
          combinedTextList.push({
            leftId: selectedLeft.id,
            rightId: part.id,
            leftSrc: selectedLeft.src,
            rightSrc: part.src
          });
          selectedLeft = null;
          document.querySelectorAll('#left-parts-grid .img-btn').forEach(b => b.classList.remove('selected'));
          renderDisplay();
          saveData();
        });
        rightContainer.appendChild(btn);
      });
    }

    function createBtn(part, onClick) {
      const btn = document.createElement('button');
      btn.className = 'img-btn';
      btn.innerHTML = `<img src="${part.src}">`;
      btn.onclick = onClick;
      return btn;
    }

    // 表示描画 ＆ 自動翻訳
    function renderDisplay() {
      displayArea.innerHTML = '';
      let autoTranslatedText = '';

      combinedTextList.forEach((pair, index) => {
        const box = document.createElement('div');
        box.className = 'combined-char';
        box.title = "クリックしてこの1文字を削除";
        box.innerHTML = `<img src="${pair.leftSrc}"><img src="${pair.rightSrc}">`;
        
        box.onclick = () => {
          combinedTextList.splice(index, 1);
          renderDisplay();
          saveData();
        };

        displayArea.appendChild(box);

        // 辞書引き
        const key = `${pair.leftId}-${pair.rightId}`;
        autoTranslatedText += dictionary[key] ? dictionary[key] : '？';
      });

      autoTranslation.textContent = autoTranslatedText;

      // 直近の入力ペアを辞書登録用に表示
      if (combinedTextList.length > 0) {
        const last = combinedTextList[combinedTextList.length - 1];
        const key = `${last.leftId}-${last.rightId}`;
        selectedPairName.textContent = `[${last.leftId} + ${last.rightId}]`;
        dictMeaning.value = dictionary[key] || '';
      } else {
        selectedPairName.textContent = '（文字未選択）';
        dictMeaning.value = '';
      }
    }

    // 辞書追加ボタン
    document.getElementById('add-dict-btn').onclick = () => {
      if (combinedTextList.length === 0) return alert('文字が選択されていません');
      const last = combinedTextList[combinedTextList.length - 1];
      const key = `${last.leftId}-${last.rightId}`;
      const meaning = dictMeaning.value.trim();
      
      if (!meaning) return alert('意味（読み方や日本語）を入力してください');

      dictionary[key] = meaning;
      alert(`辞書に登録しました: [${key}] ➔ ${dictionary[key]}`);

      // 自動クリア
      combinedTextList = [];
      dictMeaning.value = '';
      
      saveData();
      renderDisplay();
    };

    // 選択中の辞書データ削除ボタン
    document.getElementById('del-dict-btn').onclick = () => {
      if (combinedTextList.length === 0) return alert('文字が選択されていません');
      const last = combinedTextList[combinedTextList.length - 1];
      const key = `${last.leftId}-${last.rightId}`;

      if (dictionary[key]) {
        delete dictionary[key];
        alert(`[${key}] の登録を辞書から削除しました`);
        combinedTextList = [];
        dictMeaning.value = '';
        saveData();
        renderDisplay();
      } else {
        alert('この文字はまだ辞書に登録されていません');
      }
    };

    // 辞書全消去ボタン
    document.getElementById('clear-dict-all-btn').onclick = () => {
      if (confirm('登録した辞書データをすべて削除しますか？')) {
        dictionary = {};
        saveData();
        renderDisplay();
        alert('辞書データを全消去しました');
      }
    };

    // 末尾1文字削除ボタン
    document.getElementById('backspace-btn').onclick = () => {
      combinedTextList.pop();
      renderDisplay();
      saveData();
    };

    // 保存＆復元
    function saveData() {
      localStorage.setItem('oke_combined_list', JSON.stringify(combinedTextList));
      localStorage.setItem('oke_dictionary', JSON.stringify(dictionary));
      saveStatus.textContent = '💾 自動保存済み';
    }

    function loadData() {
      const savedList = localStorage.getItem('oke_combined_list');
      const savedDict = localStorage.getItem('oke_dictionary');
      if (savedList) combinedTextList = JSON.parse(savedList);
      if (savedDict) dictionary = JSON.parse(savedDict);
      renderDisplay();
    }

    // 組み合わせ文章のみをクリア
    document.getElementById('clear-btn').onclick = () => {
      if (confirm('組み合わせた文章をすべて消去しますか？（※辞書は消えません）')) {
        combinedTextList = [];
        renderDisplay();
        saveData();
      }
    };

    // モーダル処理
    const modalOverlay = document.getElementById('modal-overlay');
    const modalGrid = document.getElementById('modal-table-grid');
    const modalDictList = document.getElementById('modal-dict-list');
    const modalMatrix = document.getElementById('modal-matrix-container');
    const modalTabs = document.getElementById('modal-tabs');
    const modalTitle = document.getElementById('modal-title');

    // パーツ対応表モーダル
    document.getElementById('open-table-btn').onclick = () => {
      modalTitle.textContent = 'パーツ対応表一覧';
      modalTabs.style.display = 'flex';
      modalGrid.style.display = 'grid';
      modalDictList.style.display = 'none';
      modalMatrix.style.display = 'none';
      modalOverlay.style.display = 'flex';
      renderModalTable(leftParts);
    };

    // 20x70 マトリックス表示
    document.getElementById('open-matrix-btn').onclick = () => {
      modalTitle.textContent = '20×70 全組み合わせ＆解読一覧表';
      modalTabs.style.display = 'none';
      modalGrid.style.display = 'none';
      modalDictList.style.display = 'none';
      modalMatrix.style.display = 'block';
      modalOverlay.style.display = 'flex';
      renderMatrixTable();
    };

    // 辞書一覧モーダル
    document.getElementById('open-dict-list-btn').onclick = () => {
      modalTitle.textContent = '登録済み辞書一覧';
      modalTabs.style.display = 'none';
      modalGrid.style.display = 'none';
      modalMatrix.style.display = 'none';
      modalDictList.style.display = 'block';
      modalOverlay.style.display = 'flex';
      renderDictList();
    };

    document.getElementById('close-modal-btn').onclick = () => modalOverlay.style.display = 'none';
    
    document.getElementById('tab-left-btn').onclick = function() {
      this.classList.add('active');
      document.getElementById('tab-right-btn').classList.remove('active');
      renderModalTable(leftParts);
    };
    document.getElementById('tab-right-btn').onclick = function() {
      this.classList.add('active');
      document.getElementById('tab-left-btn').classList.remove('active');
      renderModalTable(rightParts);
    };

    function renderModalTable(partsList) {
      modalGrid.innerHTML = '';
      partsList.forEach(part => {
        const card = document.createElement('div');
        card.className = 'table-card';
        card.innerHTML = `<img src="${part.src}"><span>${part.name}</span>`;
        modalGrid.appendChild(card);
      });
    }

    // 20x70 マトリックス生成関数
    function renderMatrixTable() {
      let html = '<table class="matrix-table"><thead><tr><th class="sticky-col">L＼R</th>';
      
      // ヘッダー（右パーツ 1〜70）
      for (let r = 1; r <= 70; r++) {
        html += `<th>R${r}</th>`;
      }
      html += '</tr></thead><tbody>';

      // ボディ（左パーツ 1〜20）
      for (let l = 1; l <= 20; l++) {
        html += `<tr><td class="sticky-col">L${l}</td>`;
        for (let r = 1; r <= 70; r++) {
          const key = `L${l}-R${r}`;
          const meaning = dictionary[key] || '？';
          html += `
            <td>
              <div class="matrix-cell-char">
                <img src="images/left_${l}.jpg"><img src="images/right_${r}.jpg">
              </div>
              <div class="matrix-meaning">${meaning}</div>
            </td>
          `;
        }
        html += '</tr>';
      }

      html += '</tbody></table>';
      modalMatrix.innerHTML = html;
    }

    // 辞書一覧の描画
    function renderDictList() {
      modalDictList.innerHTML = '';
      const keys = Object.keys(dictionary);
      if (keys.length === 0) {
        modalDictList.innerHTML = '<p style="color:#94a3b8; text-align:center;">まだ辞書に登録された文字はありません。</p>';
        return;
      }

      keys.forEach(key => {
        const item = document.createElement('div');
        item.className = 'dict-list-item';
        item.innerHTML = `
          <span><strong>[${key}]</strong> ➔ <span style="color:#f59e0b;">${dictionary[key]}</span></span>
          <button class="btn btn-delete" style="padding: 4px 8px; font-size: 0.75rem;">削除</button>
        `;
        item.querySelector('button').onclick = () => {
          delete dictionary[key];
          saveData();
          renderDictList();
          renderDisplay();
        };
        modalDictList.appendChild(item);
      });
    }

    initKeyboards();
    loadData();
  </script>
</body>
</html>
